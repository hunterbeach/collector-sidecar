name: "Build V2"

on:
  push:
    branches: ["master"]

defaults:
  run:
    shell: "bash"

jobs:
  build:
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v6"
        with:
          persist-credentials: false

      - name: "Setup Go environment"
        uses: "actions/setup-go@v6"
        with:
          go-version: "1.25"

      - name: "Install cross-compilation toolchains and packaging tools"
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-multilib gcc-mingw-w64 msitools

      - name: "Run tests"
        run: "make test"

      - name: "Build cross-platform binaries"
        run: "make build-all"

      - name: "Build Windows MSI package"
        run: "make package-windows-msi-amd64"

      - name: "Setup env"
        run: |
          echo "timestamp=$(date '+%F-%H-%M-%S')" | tee -a "$GITHUB_ENV"

      - name: "Upload build artifacts"
        uses: "actions/upload-artifact@v4"
        with:
          name: "graylog-sidecar-${{ env.timestamp }}"
          path: |
            build/
            dist/pkg/
